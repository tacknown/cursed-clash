name: Build APK

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Descompactar e confirmar"]
    types: [completed]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          gradle assembleDebug --stacktrace > build.log 2>&1 || {
            msg=$(grep -A8 'What went wrong' build.log | tr '\n' ' ')
            if [ -z "$msg" ]; then msg=$(tail -n 25 build.log | tr '\n' ' '); fi
            echo "::error::$msg"
            exit 1
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CursedClash.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CursedClash-APK
          path: CursedClash.apk

      - name: Publish release (the app downloads from here)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Cursed Clash v${{ github.run_number }}
          files: CursedClash.apk
          make_latest: true
